openapi: 3.0.3
info:
  title: Meridian Mutual - Premium payment webhooks
  version: 1.0.0
  description: |
    Payment providers send notifications by webhook to Meridian's API Manager,
    which forwards the original body unchanged to the Intake service.
    Authentication uses the provider's HMAC signature, not IdP tokens.
    Intake returns 2xx only when the event is durably published to the message broker,
    or when it was already received (duplicate) or is an event type we ignore.
    Any other status code makes the provider retry.
    Extra fields in the payload are accepted and the ones Meridian does not use are ignored.
servers:
  - url: https://api.meridian.example/payments/v1
    description: API Manager
paths:
  /webhooks/quetzal:
    post:
      summary: Receive a Quetzal Pagos event (Mexico)
      description: |
        `Quetzal-Signature: t=<unix>,v1=<hex>` where `<hex>` is HMAC-SHA256 of `<t>.<raw_body>`.
        Rejected if older than 300 s. Several `v1` values are allowed (secret rotation).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: Quetzal-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuetzalEvent' }
      responses:
        '200': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Unprocessable' }
        '401': { $ref: '#/components/responses/InvalidSignature' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /webhooks/andina:
    post:
      summary: Receive an Andina Pay notification (Colombia)
      description: |
        `X-Andina-Signature` is the Base64 HMAC-SHA256 of `<X-Andina-Timestamp>.<raw_body>`.
        Rejected if the timestamp is more than 10 minutes off.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: X-Andina-Timestamp
          in: header
          required: true
          schema: { type: string, format: date-time }
        - name: X-Andina-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AndinaNotification' }
      responses:
        '200': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Unprocessable' }
        '401': { $ref: '#/components/responses/InvalidSignature' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Set by the API Manager, or generated by Intake. Returned in the response.
      schema: { type: string, maxLength: 64 }
  responses:
    Accepted:
      description: Accepted (ACCEPTED), already received (DUPLICATE) or ignored type (IGNORED). Do not retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AckResponse' }
    InvalidSignature:
      description: Missing or invalid signature, or old timestamp. Not accepted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Authentic but not processable (bad JSON, missing field, unknown state). Not accepted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooLarge:
      description: Body larger than 64 KB. Not accepted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: The broker could not store the notification in time. Not accepted; the provider retries.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AckResponse:
      type: object
      required: [result, correlationId]
      properties:
        result: { type: string, enum: [ACCEPTED, DUPLICATE, IGNORED] }
        correlationId: { type: string }
    Problem:
      description: RFC 7807 problem details. Never includes payload content or personal data.
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        correlationId: { type: string }
    QuetzalEvent:
      type: object
      additionalProperties: true
      required: [id, type, created, data]
      properties:
        id: { type: string, description: Stable across retries. }
        type: { type: string, description: 'charge.succeeded, charge.failed or charge.refunded. Other types are ignored.' }
        created: { type: integer, description: 'Unix seconds, UTC.' }
        data:
          type: object
          required: [charge]
          properties:
            charge:
              type: object
              additionalProperties: true
              required: [id, amount, currency, reference]
              properties:
                id: { type: string }
                amount: { type: integer, description: Minor unit (centavos). }
                amount_refunded: { type: integer }
                currency: { type: string }
                reference: { type: string }
                failure_code: { type: string }
                paid_at: { type: integer, nullable: true }
                refunded_at: { type: integer, nullable: true }
                payment_method:
                  type: object
                  properties:
                    type: { type: string }
    AndinaNotification:
      type: object
      additionalProperties: true
      required: [notificacion_id, transaccion]
      properties:
        notificacion_id: { type: string, description: Changes on every retry. }
        transaccion:
          type: object
          additionalProperties: true
          required: [id, estado, valor, moneda, referencia, fecha_transaccion]
          properties:
            id: { type: string }
            estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA, REVERSADA] }
            valor: { type: string, description: 'Major unit, e.g. 185000.00' }
            moneda: { type: string }
            referencia: { type: string, description: Free text typed by the payer since API 2.3. }
            medio_pago: { type: string }
            fecha_transaccion: { type: string, format: date-time }
            motivo_reverso: { type: string }