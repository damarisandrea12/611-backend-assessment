spring:
  application:
    name: payment-notification-intake
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful

intake:
  publish-timeout: 3s
  max-body-bytes: 65536

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
